spring.application.name=finpulse
server.port=8081

# Kafka Producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.compression-type=lz4

# Kafka Consumer (deserializers are overridden in KafkaConfig)
spring.kafka.consumer.group-id=finpulse
spring.kafka.consumer.auto-offset-reset=earliest

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/finpulse
spring.datasource.username=finpulse
spring.datasource.password=finpulse
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Tickers to fetch news for on every scheduled run
finpulse.watchlist=AAPL,TSLA,GOOGL,MSFT,AMZN,NVDA,META,NFLX,AMD,INTC


# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

