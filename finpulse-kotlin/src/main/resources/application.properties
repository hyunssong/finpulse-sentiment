spring.application.name=finpulse
server.port=8081

# Kafka Producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.max.request.size=1048576

# Number of salt buckets for partition key: key = {ticker}_{abs(url.hashCode()) % N}
finpulse.kafka.salt-buckets=3

# Redis: sliding TTL on per-ticker sentiment hash keys (inactive tickers auto-evict)
finpulse.redis.sentiment-ttl-days=7
# Redis: number of trending sorted-set shards; writes go to all, reads pick one at random
finpulse.redis.trending-shards=3

# Kafka Consumer (deserializers are overridden in KafkaConfig)
spring.kafka.consumer.group-id=finpulse
spring.kafka.consumer.auto-offset-reset=earliest

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/finpulse}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Fallback watchlist used when the Finnhub symbol registry cannot be reached on startup
finpulse.watchlist=AAPL,TSLA,GOOGL,MSFT,AMZN,NVDA,META,NFLX,AMD,INTC

# MIC codes of exchanges to include from Finnhub /stock/symbol (XNGS=NASDAQ, XNYS=NYSE, XASE=NYSE American)
finpulse.symbols.exchanges=XNGS,XNYS,XASE

# Delay between each per-symbol API call to respect rate limits (Finnhub free: 60 req/min)
finpulse.fetch.request-delay-ms=150

# Twelve Data API — used for daily OHLCV and RVOL calculation
twelvedata.api.key=${TWELVEDATA_API_KEY}
twelvedata.base.url=https://api.twelvedata.com
# Days of daily history to fetch per ticker (index 0 = today, 1-30 = 30-day avg baseline)
finpulse.volume.history-days=31


# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# API keys
finnhub.api.key=${FINNHUB_API_KEY}
finnhub.base.url=https://finnhub.io/api/v1
marketaux.api.key=${MARKETAUX_API_KEY}
marketaux.base.url=https://api.marketaux.com/v1
newsdata.base.url=https://newsdata.io/api/1/market
newsdata.api.key=${NEWSDATA_API_KEY}
