<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinPulse — Financial News Intelligence</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #0d1117; color: #c9d1d9; }
        a { color: #58a6ff; }
        .navbar { background: #161b22 !important; border-bottom: 1px solid #30363d; }
        .card { background: #161b22; border: 1px solid #30363d; }
        .card-header { background: #1c2128; border-color: #30363d !important; color: #c9d1d9; }
        .table {
            color: #c9d1d9;
            --bs-table-bg: transparent;
            --bs-table-hover-bg: #1c2128;
            --bs-table-hover-color: #c9d1d9;
        }
        .table thead th { border-color: #30363d; color: #8b949e; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
        .table td { border-color: #21262d; color: #c9d1d9; }
        .text-secondary { color: #8b949e !important; }
        .text-info { color: #58a6ff !important; }
        .form-control { background: #0d1117; color: #c9d1d9; border-color: #30363d; }
        .form-control:focus { background: #0d1117; color: #c9d1d9; border-color: #58a6ff; box-shadow: 0 0 0 .2rem rgba(88,166,255,.15); }
        .form-control::placeholder { color: #8b949e; }
        #alert-bar { position: sticky; top: 0; z-index: 1050; }
    </style>
</head>
<body>

<div id="alert-bar"></div>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FinPulse</a>
        <form class="d-flex gap-2" method="get" action="/search">
            <input class="form-control form-control-sm bg-dark text-light border-secondary"
                   type="text" name="symbol" placeholder="Search ticker… (AAPL)" required>
            <button class="btn btn-sm btn-outline-light" type="submit">Go</button>
        </form>
    </div>
</nav>

<div class="container py-4">

    <!-- Trending -->
    <div class="card mb-4">
        <div class="card-header border-secondary d-flex justify-content-between align-items-center">
            <div>
                <span class="fw-semibold">Trending Tickers</span>
                <small class="text-secondary ms-2">last 24 h</small>
            </div>
            <button id="btn-refresh" class="btn btn-sm btn-outline-secondary">Refresh</button>
        </div>
        <div class="card-body p-0">
            <table class="table table-sm mb-0">
                <thead><tr><th>#</th><th>Ticker</th><th>Mentions</th></tr></thead>
                <tbody id="trending-body">
                <tr th:each="t, stat : ${trending}">
                    <td th:text="${stat.count}" class="text-secondary"></td>
                    <td>
                        <a th:href="@{/ticker/{s}(s=${t.symbol})}"
                           th:text="${t.symbol}"
                           class="text-decoration-none fw-semibold text-info"></a>
                    </td>
                    <td th:text="${t.mentionCount}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(trending)}">
                    <td colspan="3" class="text-secondary text-center py-3">No data yet — fetch some articles first.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Movers -->
    <div class="card">
        <div class="card-header border-secondary">
            <span class="fw-semibold">Sentiment Movers</span>
            <small class="text-secondary ms-2">24 h shift</small>
        </div>
        <div class="card-body p-0">
            <table class="table table-sm mb-0">
                <thead><tr><th>Ticker</th><th>Recent</th><th>Previous</th><th>Shift</th></tr></thead>
                <tbody id="movers-body">
                <tr th:each="m : ${movers}">
                    <td>
                        <a th:href="@{/ticker/{s}(s=${m.symbol})}"
                           th:text="${m.symbol}"
                           class="text-decoration-none fw-semibold text-info"></a>
                    </td>
                    <td th:text="${#numbers.formatDecimal(m.recentScore, 1, 3)}"></td>
                    <td th:text="${#numbers.formatDecimal(m.previousScore, 1, 3)}"></td>
                    <td>
                        <span th:classappend="${m.shift >= 0} ? 'text-success' : 'text-danger'"
                              th:text="${(m.shift >= 0 ? '+' : '') + #numbers.formatDecimal(m.shift, 1, 3)}"></span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(movers)}">
                    <td colspan="4" class="text-secondary text-center py-3">No movers data yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/alerts.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
