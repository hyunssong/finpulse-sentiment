<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinPulse — Tracked Symbols</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #0d1117; color: #c9d1d9; }
        a { color: #58a6ff; }
        .navbar { background: #161b22 !important; border-bottom: 1px solid #30363d; }
        .card { background: #161b22; border: 1px solid #30363d; }
        .card-header { background: #1c2128; border-color: #30363d !important; color: #c9d1d9; }
        .form-control { background: #0d1117; color: #c9d1d9; border-color: #30363d; }
        .form-control:focus { background: #0d1117; color: #c9d1d9; border-color: #58a6ff; box-shadow: 0 0 0 .2rem rgba(88,166,255,.15); }
        .form-control::placeholder { color: #8b949e; }
        .symbol-grid { display: flex; flex-wrap: wrap; gap: .5rem; padding: 1rem; }
        .symbol-chip {
            display: inline-block;
            padding: .25rem .6rem;
            border: 1px solid #30363d;
            border-radius: .375rem;
            font-size: .85rem;
            font-weight: 600;
            color: #58a6ff;
            text-decoration: none;
            background: #0d1117;
        }
        .symbol-chip:hover { background: #1c2128; border-color: #58a6ff; color: #58a6ff; }
        .symbol-chip.hidden { display: none; }
        #count { color: #8b949e; font-size: .85rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FinPulse</a>
        <div class="d-flex gap-3 align-items-center">
            <a href="/symbols" class="text-light text-decoration-none small">Symbols</a>
            <form class="d-flex gap-2" method="get" action="/search">
                <input class="form-control form-control-sm bg-dark text-light border-secondary"
                       type="text" name="symbol" placeholder="Search ticker… (AAPL)" required>
                <button class="btn btn-sm btn-outline-light" type="submit">Go</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="card">
        <div class="card-header border-secondary d-flex justify-content-between align-items-center">
            <div>
                <span class="fw-semibold">Tracked Symbols</span>
                <span id="count" class="ms-2">
                    <span id="visible-count" th:text="${total}"></span> of
                    <span th:text="${total}"></span>
                </span>
            </div>
            <input id="filter-input" class="form-control form-control-sm w-auto"
                   type="text" placeholder="Filter symbols…" style="min-width:180px">
        </div>
        <div class="symbol-grid" id="symbol-grid">
            <a th:each="sym : ${symbols}"
               th:href="@{/ticker/{s}(s=${sym})}"
               th:text="${sym}"
               th:attr="data-sym=${sym}"
               class="symbol-chip"></a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const input = document.getElementById('filter-input');
    const chips = document.querySelectorAll('.symbol-chip');
    const visibleCount = document.getElementById('visible-count');

    input.addEventListener('input', () => {
        const q = input.value.trim().toUpperCase();
        let shown = 0;
        chips.forEach(chip => {
            const match = !q || chip.dataset.sym.includes(q);
            chip.classList.toggle('hidden', !match);
            if (match) shown++;
        });
        visibleCount.textContent = shown;
    });
</script>
</body>
</html>
