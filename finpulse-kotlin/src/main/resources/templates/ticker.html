<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|FinPulse — ${symbol}|">FinPulse — Ticker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #0d1117; color: #c9d1d9; }
        a { color: #58a6ff; }
        .navbar { background: #161b22 !important; border-bottom: 1px solid #30363d; }
        .card { background: #161b22; border: 1px solid #30363d; }
        .card-header { background: #1c2128; border-color: #30363d !important; color: #c9d1d9; }
        .card-footer { background: #1c2128; border-color: #30363d !important; }
        /* Override Bootstrap list-group defaults so hover never flips to light bg */
        .list-group-item {
            background: #161b22;
            border-color: #21262d;
            color: #c9d1d9;
        }
        .list-group-item-action:hover,
        .list-group-item-action:focus {
            background: #1c2128;
            color: #c9d1d9;
        }
        .article-card:hover { border-color: #58a6ff !important; }
        .text-secondary { color: #8b949e !important; }
        .text-info { color: #58a6ff !important; }
        .form-control { background: #0d1117; color: #c9d1d9; border-color: #30363d; }
        .form-control:focus { background: #0d1117; color: #c9d1d9; border-color: #58a6ff; box-shadow: 0 0 0 .2rem rgba(88,166,255,.15); }
        .form-control::placeholder { color: #8b949e; }
        .btn-outline-secondary { color: #8b949e; border-color: #30363d; }
        .btn-outline-secondary:hover { background: #21262d; color: #c9d1d9; border-color: #30363d; }
        #alert-bar { position: sticky; top: 0; z-index: 1050; }
        .sentiment-positive { color: #3fb950; }
        .sentiment-negative { color: #f85149; }
        .sentiment-neutral  { color: #8b949e; }
    </style>
</head>
<body th:attr="data-symbol=${symbol},data-offset=${currentOffset},data-limit=${limit},data-total=${totalArticles}">

<div id="alert-bar"></div>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FinPulse</a>
        <form class="d-flex gap-2" method="get" action="/search">
            <input class="form-control form-control-sm bg-dark text-light border-secondary"
                   type="text" name="symbol" placeholder="Search ticker…" required>
            <button class="btn btn-sm btn-outline-light" type="submit">Go</button>
        </form>
    </div>
</nav>

<div class="container py-4">

    <!-- Header -->
    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/" class="text-secondary text-decoration-none">← Back</a>
        <h1 class="h3 mb-0 fw-bold" th:text="${symbol}"></h1>
        <span class="badge fs-6"
              th:classappend="'bg-' + ${signalColor}"
              th:text="${signal}"></span>
    </div>

    <!-- Sentiment chart -->
    <div class="card mb-4">
        <div class="card-header border-secondary">
            <span class="fw-semibold">30-Day Sentiment Trend</span>
        </div>
        <div class="card-body">
            <canvas id="sentimentChart" height="80"></canvas>
        </div>
    </div>

    <!-- Sentiment breakdown -->
    <div class="card mb-4">
        <div class="card-header border-secondary">
            <span class="fw-semibold">Daily Sentiment Breakdown</span>
            <small class="text-secondary ms-2">positive / negative / neutral per day</small>
        </div>
        <div class="card-body">
            <canvas id="breakdownChart" height="80"></canvas>
            <p id="breakdown-empty" class="text-secondary text-center mb-0" style="display:none;">No breakdown data yet.</p>
        </div>
    </div>

    <!-- Articles -->
    <div class="card">
        <div class="card-header border-secondary d-flex justify-content-between align-items-center">
            <span class="fw-semibold">News Articles</span>
            <small class="text-secondary" id="articles-count"></small>
        </div>
        <div id="articles-container" class="list-group list-group-flush">

            <a th:each="a : ${articles}"
               th:href="${a.url}"
               target="_blank"
               class="list-group-item list-group-item-action article-card">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="me-3">
                        <div class="fw-semibold mb-1" th:text="${a.title}"></div>
                        <small class="text-secondary" th:text="${a.summary}"></small>
                    </div>
                    <div class="text-end text-nowrap ms-2">
                        <div class="small"
                             th:classappend="'sentiment-' + ${a.sentiment}"
                             th:text="${#strings.capitalize(a.sentiment)}"></div>
                        <div class="small text-secondary"
                             th:text="${#numbers.formatDecimal(a.sentimentScore, 1, 3)}"></div>
                        <div class="small text-secondary mt-1"
                             th:text="${a.source}"></div>
                    </div>
                </div>
            </a>

            <div th:if="${#lists.isEmpty(articles)}"
                 class="list-group-item text-secondary text-center py-4">
                No articles found for this ticker yet.
            </div>

        </div>
        <div class="card-footer border-secondary d-flex justify-content-between" id="pagination-bar">
            <button class="btn btn-sm btn-outline-secondary" id="btn-prev" disabled>← Prev</button>
            <span class="text-secondary small" id="page-info"></span>
            <button class="btn btn-sm btn-outline-secondary" id="btn-next">Next →</button>
        </div>
    </div>

</div>

<script th:inline="javascript">
    window.sentimentData = /*[[${sentimentData}]]*/ [];
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="/js/alerts.js"></script>
<script src="/js/ticker.js"></script>
</body>
</html>
